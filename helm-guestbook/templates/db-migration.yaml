# Argo CD PreSync hook: runs BEFORE the main app resources sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting DB migration..."
              sleep 2
              echo "Applied migration: 001_create_users.sql"
              echo "DB migration completed successfully"
