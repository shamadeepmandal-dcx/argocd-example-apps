# Argo CD PreSync hook: runs BEFORE the main app resources sync.
# Typical use: schema migrate, then Deployments start against the new schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting DB migration..."
              # Replace this with a real migrate command, e.g.:
              # migrate -path /migrations -database "$DB_URL" up
              sleep 2
              echo "Applied migration: 001_create_users.sql"
              echo "DB migration completed successfully"
          # env:
          #   - name: DB_URL
          #     valueFrom:
          #       secretKeyRef:
          #         name: db-credentials
          #         key: url
